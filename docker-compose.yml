services:
  traefik:
    image: traefik:v3.4
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  db:
    image: postgres:16
    env_file:
      - .env
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  api:
    build: ./api
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3000:3000"
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard-v2
    container_name: wise-dashboard-v2
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3001:3000"
    restart: unless-stopped

  dashboard-v3:
    build:
      context: ./dashboard-v3
      args:
        VITE_API_BASE: ""
    container_name: wise-dashboard-v3
    ports:
      - "3002:80"
    restart: unless-stopped

  worker:
    build: ./worker
    env_file:
      - .env
    restart: unless-stopped

  discord-bot:
    build: ./bot
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
