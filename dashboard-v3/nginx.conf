server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /metrics   { proxy_pass http://api:3000/metrics;   proxy_read_timeout 10s; }
    location /events    { proxy_pass http://api:3000/events;    proxy_read_timeout 10s; }
    location /services  { proxy_pass http://api:3000/services;  proxy_read_timeout 15s; }
    location /business  { proxy_pass http://api:3000/business;  proxy_read_timeout 10s; }
    location /ops/      { proxy_pass http://api:3000/ops/;      proxy_read_timeout 10s; }
    location /ai/       { proxy_pass http://api:3000/ai/;       proxy_read_timeout 60s; }

    location / { try_files $uri $uri/ /index.html; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
